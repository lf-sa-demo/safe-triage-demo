apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: safe-triage-demo
  labels:
    app: broker
spec:
  selector:
    app: broker
  ports:
    - name: broker-http
      port: 8080
      targetPort: 8080
    - name: mcp-gateway
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: broker-gateway
  namespace: safe-triage-demo
  labels:
    app: broker
spec:
  selector:
    app: broker
  ports:
    - name: mcp
      port: 8081
      targetPort: 8081

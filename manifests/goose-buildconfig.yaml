apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: goose-agent
  namespace: safe-triage-demo
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: goose-agent
  namespace: safe-triage-demo
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: goose-agent:latest
  triggers: []

# These secrets must be created before deploying.
# DO NOT commit actual secret values to this file.
#
# Create them with:
#
#   oc create secret generic broker-hmac \
#     --from-literal=hmac-key="$(openssl rand -hex 32)" \
#     -n safe-triage-demo --context=lf-poc
#
#   oc create secret generic github-app-key \
#     --from-file=private-key.pem=<path-to-pem> \
#     -n safe-triage-demo --context=lf-poc
#
#   oc create secret generic github-app-token \
#     --from-literal=github-app-token="<installation-token>" \
#     -n safe-triage-demo --context=lf-poc
#
#   oc create secret generic openrouter-api-key \
#     --from-literal=OPENAI_API_KEY="<key>" \
#     -n safe-triage-demo --context=lf-poc

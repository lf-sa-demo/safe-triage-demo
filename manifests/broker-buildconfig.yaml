apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: safe-triage-broker
  namespace: safe-triage-demo
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: safe-triage-broker
  namespace: safe-triage-demo
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: safe-triage-broker:latest
  triggers: []

# Network policies for safe-triage-demo
#
# Label-based pod selection:
#   Agent pods:  app.kubernetes.io/instance=safe-triage-agent (Helm chart label)
#   Broker pods: app=broker
#   Bridge pods: app=approval-bridge
#   Goose pods:  app=goose-agent
#
# Note: OVN-Kubernetes evaluates egress AFTER Service DNAT, so DNS rules
# target port 5353 (the backend pod port), not 53.
---
# 1. agent-egress: Agent pods can reach DNS, broker (8080 + 8081),
#    and external HTTPS (443). Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: safe-triage-demo
  labels:
    app.kubernetes.io/part-of: safe-triage-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: safe-triage-agent
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - podSelector:
            matchLabels:
              app: broker
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# 2. broker-egress: Broker can reach DNS and external HTTPS (GitHub API).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-egress
  namespace: safe-triage-demo
  labels:
    app.kubernetes.io/part-of: safe-triage-demo
spec:
  podSelector:
    matchLabels:
      app: broker
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# 3. broker-ingress: Broker accepts from agent pods, bridge pods,
#    and goose-agent pods on both ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-ingress
  namespace: safe-triage-demo
  labels:
    app.kubernetes.io/part-of: safe-triage-demo
spec:
  podSelector:
    matchLabels:
      app: broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: safe-triage-agent
        - podSelector:
            matchLabels:
              app: approval-bridge
        - podSelector:
            matchLabels:
              app: goose-agent
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
---
# 4. bridge-egress: Bridge can reach DNS, broker (8080 + 8081),
#    and external HTTPS (GitHub API).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-egress
  namespace: safe-triage-demo
  labels:
    app.kubernetes.io/part-of: safe-triage-demo
spec:
  podSelector:
    matchLabels:
      app: approval-bridge
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - podSelector:
            matchLabels:
              app: broker
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# 5. goose-egress: Goose agent can reach DNS, broker (8080),
#    and external HTTPS (OpenRouter 443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goose-egress
  namespace: safe-triage-demo
  labels:
    app.kubernetes.io/part-of: safe-triage-demo
spec:
  podSelector:
    matchLabels:
      app: goose-agent
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - podSelector:
            matchLabels:
              app: broker
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

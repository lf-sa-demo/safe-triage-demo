apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: safe-triage-demo
spec:
  podSelector:
    matchLabels:
      app: safe-triage-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: UDP
          port: 5353
    - to:
        - podSelector:
            matchLabels:
              app: broker
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-egress
  namespace: safe-triage-demo
spec:
  podSelector:
    matchLabels:
      app: broker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: UDP
          port: 5353
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-ingress
  namespace: safe-triage-demo
spec:
  podSelector:
    matchLabels:
      app: broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: safe-triage-agent
        - podSelector:
            matchLabels:
              app: approval-bridge
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-egress
  namespace: safe-triage-demo
spec:
  podSelector:
    matchLabels:
      app: approval-bridge
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: UDP
          port: 5353
    - to:
        - podSelector:
            matchLabels:
              app: broker
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
